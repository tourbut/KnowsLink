<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silent Agent Relay · relay.v1</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design · relay.v1</p>
    <h1>Silent Agent Relay</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sar-arch-title sar-arch-desc">
        <title id="sar-arch-title">Silent Agent Relay architecture</title>
        <desc id="sar-arch-desc">Person A’s agent posts a signed relay.v1 message to the Relay mailbox; B’s agent pulls with lease, ACKs after durable inbox, then either returns relay.result silently or escalates via relay.approval.request to B-human.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.7" fill="rgba(45,49,66,0.08)"/>
          </pattern>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>
        <rect width="1280" height="720" fill="url(#dot-grid)"/>

        <!-- Zone: Side A -->
        <rect x="40" y="80" width="280" height="480" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="148" y="84" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="180" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">SIDE A</text>

        <!-- Zone: Relay -->
        <rect x="360" y="80" width="400" height="480" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="520" y="84" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="560" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">RELAY</text>

        <!-- Zone: Side B -->
        <rect x="800" y="80" width="440" height="480" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="988" y="84" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1020" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">SIDE B</text>

        <!-- === ARROWS (before boxes) === -->

        <!-- A-human → A-agent -->
        <line x1="180" y1="196" x2="180" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="188" y="212" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="212" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASK</text>

        <!-- A-agent → Relay (primary HTTPS) -->
        <line x1="320" y1="280" x2="424" y2="280" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="344" y="260" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="372" y="269" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST</text>

        <!-- Relay → Intent registry (down) -->
        <line x1="500" y1="344" x2="500" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="508" y="360" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="534" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOKUP</text>

        <!-- Relay → Receipts (down) -->
        <line x1="620" y1="344" x2="620" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="628" y="360" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="656" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECEIPT</text>

        <!-- Relay → B-agent pull (primary) -->
        <line x1="696" y1="280" x2="848" y2="280" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="744" y="260" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772" y="269" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LEASE</text>

        <!-- B-agent → Durable inbox -->
        <line x1="920" y1="344" x2="920" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="928" y="360" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="946" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACK</text>

        <!-- Durable → Relay ACK dashed return (hop under LEASE if needed - route below) -->
        <path d="M 848,432 H 760 Q 752,432 752,424 V 320 Q 752,312 744,312 H 696"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="756" y="400" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="776" y="409" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACK</text>

        <!-- B-agent → B-human escalate (via relay conceptually as dashed) -->
        <line x1="992" y1="280" x2="1072" y2="280" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="1008" y="260" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1044" y="269" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPROVAL</text>

        <!-- Result return: B-agent top → above zones → A-agent left -->
        <path d="M 920,248 V 120 H 560 Q 552,120 552,128 V 248"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="700" y="100" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="736" y="109" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text>

        <path d="M 424,248 V 120 H 40 Q 32,120 32,128 V 280 H 116"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="200" y="100" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="236" y="109" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text>

        <!-- === NODES === -->

        <!-- A-human -->
        <rect x="116" y="132" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="116" y="132" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="124" y="140" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="142" y="149" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
        <text x="180" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">A-human</text>
        <text x="180" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">intent owner</text>

        <!-- A-agent -->
        <rect x="116" y="248" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="116" y="248" width="128" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="124" y="256" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="140" y="265" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
        <text x="180" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">A-agent</text>
        <text x="180" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sign · send</text>

        <!-- Relay mailbox FOCAL -->
        <rect x="424" y="248" width="272" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="248" width="272" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="432" y="256" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="454" y="265" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="680" y="332" fill="rgba(235,108,54,0.10)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
        <text x="560" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">Relay mailbox</text>
        <text x="560" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth → idem → queue · lease 30s/3</text>
        <text x="560" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">delivered = inbox + ACK</text>

        <!-- Intent registry -->
        <rect x="424" y="400" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="400" width="152" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="432" y="408" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="450" y="417" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REG</text>
        <text x="500" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">Intent registry</text>
        <text x="500" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">immutable · ADD-only</text>

        <!-- Receipt store -->
        <rect x="544" y="400" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="544" y="400" width="152" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="552" y="408" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="574" y="417" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RCPT</text>
        <text x="620" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">Receipt store</text>
        <text x="620" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">24h · not full envelope</text>

        <!-- B-agent -->
        <rect x="848" y="248" width="144" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="848" y="248" width="144" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="856" y="256" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="872" y="265" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
        <text x="920" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">B-agent</text>
        <text x="920" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">silent-first</text>
        <text x="920" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exec claim</text>

        <!-- Durable inbox -->
        <rect x="848" y="400" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="848" y="400" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="856" y="408" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="876" y="417" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INBOX</text>
        <text x="920" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">Durable inbox</text>
        <text x="920" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">then ACK</text>

        <!-- B-human FOCAL 2? - use muted external for human, only 1 coral on Relay -->
        <rect x="1072" y="248" width="144" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="1072" y="248" width="144" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="1080" y="256" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="1098" y="265" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
        <text x="1144" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">B-human</text>
        <text x="1144" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">approval gate</text>
        <text x="1144" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">not hint · bind M</text>

        <!-- Legend -->
        <line x1="40" y1="596" x2="1240" y2="596" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="632" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">Relay core</text>

        <rect x="160" y="632" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="180" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">Agent</text>

        <rect x="260" y="632" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="280" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">Store</text>

        <rect x="360" y="632" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="380" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">Human</text>

        <line x1="480" y1="638" x2="508" y2="638" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="516" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">Primary send</text>

        <line x1="640" y1="638" x2="668" y2="638" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="676" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">HTTPS pull</text>

        <line x1="780" y1="638" x2="808" y2="638" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="816" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans KR', sans-serif">ACK / result / escalate</text>
      </svg>
    </div>
  </div>
</body>
</html>
