# OPS inserts this rule before a 404 fallback for the no-Access deployment (D12).
# The older Access-protected deployment may keep its verified owner/trial rules instead.
# This fragment alone does not change edge Access applications. Follow D12 before activation.
# /privacy and /terms are the public policy pages (SAR-PUBLISH-001). /home/calendar/* was retired (D018); the relay
# answers 404 there, so the /home rule needs no calendar exception. /install/<version>/ serves the pinned
# auto-setup files (SAR-AUTOSETUP-001); the relay answers 404 unless KNOWSLINK_INSTALL_DIR holds that release.
- hostname: link.knowslog.com
  path: '^(/|/privacy|/terms|/auth/(google(/callback)?|start|verify|reauth|logout(-all)?)|/home(/.*)?|/lang/(ko|en)|/connect/[A-Za-z0-9_-]{43}|/v1/connect/(start|poll|info|prepare|complete)|/v1/text/(send|pull|persist|ack|events|seen)|/v1/contacts/[a-z][a-z0-9_:-]*|/v1/keys/[a-z][a-z0-9_:-]*/[A-Za-z0-9_:-]+|/v1/receipts/[0-9a-f-]+|/mcp|/\.well-known/(oauth-protected-resource(/mcp)?|oauth-authorization-server)|/remote/oauth/(register|authorize|token|revoke)|/remote/consent/[A-Za-z0-9_-]{43}|/install/[0-9]+\.[0-9]+\.[0-9]+/knowslink-[a-z0-9-]+\.(ps1|zip))$'
  service: http://relay:8080
  originRequest:
    access:
      required: false
