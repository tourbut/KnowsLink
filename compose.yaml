# Local development packaging; Tunnel ingress remains disabled by default.
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: knowslink
      POSTGRES_DB: knowslink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U knowslink -d knowslink"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: [/app/migrate]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
  relay:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RELAY_ADDR: 0.0.0.0:8080
      KNOWSLINK_TEST_AGENTS: ${KNOWSLINK_TEST_AGENTS:-}
    ports: ["127.0.0.1:${RELAY_PORT:-8080}:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [database, ingress]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    profiles: [tunnel]
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      relay:
        condition: service_healthy
    networks: [ingress]
volumes:
  postgres-data:
networks:
  database:
    internal: true
  ingress:
