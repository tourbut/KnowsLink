# Local development packaging; Tunnel ingress remains disabled by default.
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: knowslink
      POSTGRES_DB: knowslink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U knowslink -d knowslink"]
      interval: 2s
      timeout: 3s
      retries: 20
  # Messages live only here: no RDB or AOF, no published port, internal network only (D051).
  # noeviction refuses writes at the memory cap, so the relay answers unavailable instead of silently dropping messages.
  redis:
    image: redis:8.10.2-alpine@sha256:9f8d2d789b9a1d1e3f283f979aa9cbf393373806472e1ccd460e2f9c869b833b
    command: [redis-server, --save, "", --appendonly, "no", --protected-mode, "no", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    user: "999:1000"
    networks: [database]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: [/app/migrate]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
  relay:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      RELAY_ADDR: 0.0.0.0:8080
      KNOWSLINK_TEST_AGENTS: ${KNOWSLINK_TEST_AGENTS:-}
      KNOWSLINK_SYNTHETIC_SIGNUP: ${KNOWSLINK_SYNTHETIC_SIGNUP:-}
      KNOWSLINK_SMTP_URL: ${KNOWSLINK_SMTP_URL:-}
      KNOWSLINK_GOOGLE_CLIENT_ID: ${KNOWSLINK_GOOGLE_CLIENT_ID:-}
      KNOWSLINK_GOOGLE_CLIENT_SECRET: ${KNOWSLINK_GOOGLE_CLIENT_SECRET:-}
      KNOWSLINK_GOOGLE_REDIRECT_URL: ${KNOWSLINK_GOOGLE_REDIRECT_URL:-}
      KNOWSLINK_MAIL_FROM: ${KNOWSLINK_MAIL_FROM:-}
      KNOWSLINK_CLIENT_IP_HEADER: ${KNOWSLINK_CLIENT_IP_HEADER:-}
    ports: ["127.0.0.1:${RELAY_PORT:-8080}:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [database, ingress]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    profiles: [tunnel]
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      relay:
        condition: service_healthy
    networks: [ingress]
volumes:
  postgres-data:
networks:
  database:
    internal: true
  ingress:
